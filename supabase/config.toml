# Local Supabase CLI project configuration.
#
# Discharges the deferred-work.md entry that has blocked `supabase start` /
# `supabase db push` locally since Story 1.1: "Belongs with Story 1.5, which
# first writes schema." This is that story. Full reference:
# https://supabase.com/docs/guides/local-development/cli/config
#
# Every field below is a deliberate choice, not the CLI's `init` default.
# Everything omitted falls back to the CLI's own built-in default, which is
# safe to do — this file only needs to say where it differs.
#
#   - `db.major_version = 17` matches THE HOSTED PROJECT, which is what this
#     value is for. It read 15 until 2026-09-05, on the reasoning that 15
#     "matches ARCHITECTURE-SPINE.md's stack pin". That read a minimum as a
#     target: the spine pins "Postgres | Supabase-managed, >=15.1.1.61 —
#     required for sub-minute Supabase Cron", and the dev project provisioned
#     in Story 9.1 came up on 17.6.1.166, which satisfies it.
#
#     Local must track hosted, not the floor. A local stack on 15 would have
#     run every integration test — including AD-6's concurrency proof, which
#     had never executed anywhere before Story 9.1 — against a major version
#     nothing deploys on. Change this when the hosted projects move, and keep
#     dev and prod on the same major version as each other (Story 9.8).
#   - Storage, Realtime, Analytics and the local SMTP test server are
#     switched off. None is exercised by any story yet — this product sends no
#     email for any purpose, ever (PRD "no email field exists anywhere"). Every
#     disabled service is one fewer container `supabase start` has to pull and
#     hold up in CI.
#   - The Edge Runtime is ON as of Story 3.5. It was off while its comment
#     read "the Edge Function that will need the runtime is Epic 3's tick,
#     which does not exist yet"; the tick now exists at
#     `supabase/functions/tick/`, and `supabase functions serve` is a real
#     local workflow rather than a hypothetical one. The SCHEDULE that invokes
#     it is a different question and is still off: the migration creates the
#     `bbsl-tick` cron job inactive, deliberately.
project_id = "bbsl-appspiration"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = true

[db.seed]
# No seed.sql exists — nothing here is seeded data. Story 1.7-1.9 own the
# Fantrax import, which is an application-level upload, not a fixture.
enabled = false

# Story 4.1 turns this on. A channel is the push half of AD-29's freshness
# contract, and with Realtime off the local stack cannot serve one at all --
# nothing about the watermark subscription could be exercised, and the manual
# check in the story's own Verification section would have nothing to check.
# The same-origin liveness poll works either way; the socket does not.
[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = false

[storage]
enabled = false

[storage.s3_protocol]
enabled = false

[auth]
enabled = true

# The origin Supabase sends a signed-in browser back to. Set to the pilot
# branch deploy (Story 9.1) rather than localhost, because this file is pushed
# to the hosted project with `supabase config push` — the same values serve the
# local stack and the dev project, and the hosted one is the one people use.
# Harmless locally: `site_url`'s other job is addressing email links, and this
# product sends no email for any purpose, ever.
site_url = "https://pilot--bbslapp.netlify.app"

# Every origin Supabase may redirect back to after Discord.
#
# `src/routes/signin/+page.server.ts:67` passes `event.url.origin` — the origin
# the browser is actually on — to `signInWithOAuth`, not APP_ORIGIN. So this
# list must name each origin a Manager might sign in from, and nothing else: an
# entry here is somewhere an OAuth code may be delivered.
#
# The trailing `**` covers the optional `?next=` the callback carries for a
# deep link. Note Supabase's matcher treats a literal `?` as a single-character
# wildcard, so `**` is the correct way to admit a query string rather than
# writing `?*`.
#
# Deploy previews are deliberately ABSENT. Admitting `deploy-preview-*` would
# make every pull request a valid destination for a real OAuth code, which is a
# wider opening than the pilot needs.
# Each origin is listed TWICE on purpose: the exact URL, and the `**` form for
# the optional `?next=` deep link. Supabase's matcher is a glob, and whether
# `/auth/callback**` also matches a bare `/auth/callback` with no suffix is not
# documented — listing both removes the question rather than relying on the
# answer. A redirect_to that fails the match is not refused; Supabase silently
# falls back to `site_url`, which is the kind of failure that costs an evening.
additional_redirect_urls = [
  "https://pilot--bbslapp.netlify.app/auth/callback",
  "https://pilot--bbslapp.netlify.app/auth/callback**",
  "http://127.0.0.1:3000/auth/callback",
  "http://127.0.0.1:3000/auth/callback**"
]

# No self-service registration exists in this product (AD-15) — pre-registered
# Discord accounts only, added by the Commissioner directly in `managers`.
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false

# Discord as the identity provider (AD-15, FR-4). Story 9.2.
#
# The app does NOT hand-roll this flow: `src/lib/server/supabase.ts:165` calls
# `signInWithOAuth({ provider: 'discord' })`, so Supabase owns the handshake and
# Discord's own redirect URI points at Supabase's callback
# (`/auth/v1/callback`), never at this app. The app's callback is admitted by
# `additional_redirect_urls` above instead. Getting those two backwards is the
# usual way this fails.
#
# `env(...)` reads from the gitignored `.env` at push time, so the secret is
# never committed. The four DISCORD_* names in `.env.example` are consumed HERE
# and by the Edge Function — no application code reads any of them.
#
# Note Supabase's Discord provider requests the `email` scope and offers no way
# to drop it, so a Manager sees Discord ask for their address. Nothing reads it:
# `discordIdentityOf` (src/lib/server/auth.ts:222) takes only `identities[].id`
# for this provider and ignores `user_metadata` entirely. PRD's "no email field
# exists anywhere" still holds.
[auth.external.discord]
enabled = true
client_id = "env(DISCORD_CLIENT_ID)"
secret = "env(DISCORD_CLIENT_SECRET)"

[edge_runtime]
# The tick (Story 3.5). One function, `supabase/functions/tick`, invoked by one
# pg_cron schedule that is created inactive — see
# supabase/migrations/20260831000000_tick.sql. Serving it locally is
# `npx supabase functions serve tick`.
enabled = true

[analytics]
enabled = false
