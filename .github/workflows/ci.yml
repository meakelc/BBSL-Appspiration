# Runs the suite that `npm run build` does not.
#
# The build path is `check-pins && vite build`, so nothing in the deploy
# pipeline invokes vitest or svelte-check. Without this workflow all 183 tests
# can be red — or the drift gate removed from the build script entirely — while
# a Netlify deploy still succeeds.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# The suite reads the tree and nothing else.
permissions:
  contents: read

# A newer push to the same ref supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: test and typecheck
    runs-on: ubuntu-latest

    steps:
      # Actions are pinned to a commit, not a tag, and the tag is recorded
      # beside it. A tag is mutable and this repository does not float pins.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # .nvmrc is the source of truth and check-pins.js asserts it names
          # major 24. A literal here would be a fourth place the Node pin lives.
          node-version-file: .nvmrc
          cache: npm

      # ci, not install — direct dependencies are pinned exactly, but transitive
      # versions resolve fresh unless the lockfile is installed from.
      - name: Install
        run: npm ci

      # Story 1.5's two integration tests (tests/integration/auction-events.test.ts)
      # are the only automated proof of AC1 (no role, including service_role,
      # holds UPDATE/DELETE) and the lock-serialization AC against a real
      # Postgres — every DB-touching test before this story stubbed the
      # client. `supabase start` applies supabase/migrations/ on a fresh local
      # Postgres, the same way `db push` would against a real project.
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.115.0

      - name: Start local Supabase
        run: supabase start

      # Also covers the drift gate against the real repository: pins.test.ts
      # drives checkPins(readRepositoryInputs()), so a separate check:pins step
      # would assert the same thing twice. SUPABASE_DB_URL matches the local
      # Postgres port supabase/config.toml declares (db.port = 54322) — the
      # same default tests/integration/auction-events.test.ts's reachability
      # probe falls back to when the variable is unset, stated explicitly here
      # so CI does not depend on that fallback silently agreeing with it.
      - name: Test
        run: npm test
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      # Runs even if Test failed, so a failed run does not leave the runner's
      # Docker daemon holding the local stack.
      - name: Stop local Supabase
        if: always()
        run: supabase stop

      # svelte-kit sync && svelte-check. Nothing else runs this — the build
      # does not typecheck.
      - name: Typecheck
        run: npm run check

      # AD-2: the rules core is loaded by two runtimes and must never be copied
      # per runtime. The static purity gate above proves the core reaches for
      # nothing forbidden; only Deno proves it actually resolves and
      # type-checks under the runtime the tick Edge Function runs in. Deno is
      # not installed on a developer machine, so this is the only place the
      # second half of that guarantee is checked.
      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.5

      # --no-config so a stray deno.json cannot change what is being proved;
      # --node-modules-dir=none so the repository's package.json cannot pull the
      # core into npm resolution, which is the other half of "resolves under
      # Deno on its own"; --no-lock because nothing here resolves a remote
      # dependency at all — a core file that needs one is already a purity-gate
      # failure. `find` rather than a `*.ts` glob so nested rules/ and
      # projection/ files are covered as the purity walk covers them.
      - name: Type-check the core under Deno
        run: find src/lib/core -name '*.ts' -print0 | xargs -0 --no-run-if-empty deno check --no-config --no-lock --node-modules-dir=none

      # The OTHER half of AD-2, and the half nothing else covers. The core is
      # not all Deno loads: the tick's entry point pulls in `server/sweep.ts`,
      # `server/close.ts`, `server/phase-end.ts`, `server/outbox.ts` and
      # `adapters/discord/webhook.ts`, every one of which is ordinary
      # TypeScript that Node also unit-tests. A `node:` builtin, a `$env`
      # import or a bare specifier in any of them is invisible to `npm test`,
      # to `npm run check` and to the purity gate — which walks `src/lib/core`
      # only — and breaks nothing until the deployed Edge Function tries to
      # load it. This step is the only thing standing between that and
      # production.
      #
      # `--config` is load-bearing and is NOT the `--no-config` used above:
      # Deno discovers a config file by walking up from the CWD rather than
      # from the entry module, so the bare form fails at the repository root
      # with `Import "postgres" not a dependency` — which looks like a broken
      # import and is really a missing flag. The tick DOES resolve remote
      # dependencies (deno.land/x/postgres, npm:@supabase/supabase-js), which
      # is exactly why it has its own import map and its own deno.lock.
      - name: Type-check the tick under Deno
        run: deno check --config supabase/functions/tick/deno.json supabase/functions/tick/index.ts
